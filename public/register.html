<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Registration — IEEE CIS VVCE</title>
  <script>
    const eventId = new URLSearchParams(window.location.search).get('event');
    const target = eventId ? `./#/register?event=${eventId}` : './#/events';
    window.location.replace(target);
  </script>
</head>
<body style="background:#030712;color:#fff;font-family:sans-serif;padding:2rem;text-align:center;">
  <p>Redirecting to Event Registration...</p>
</body>
</html>
