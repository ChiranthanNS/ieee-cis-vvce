<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Event — IEEE CIS VVCE</title>
  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const target = id ? `./#/events/${id}` : './#/events';
    window.location.replace(target);
  </script>
</head>
<body style="background:#030712;color:#fff;font-family:sans-serif;padding:2rem;text-align:center;">
  <p>Redirecting to Event Details...</p>
</body>
</html>
