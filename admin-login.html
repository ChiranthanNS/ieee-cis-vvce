<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Login — IEEE CIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-white flex items-center justify-center h-screen">

<div class="glassCard w-96 p-8">

  <h2 class="text-2xl font-bold mb-6 text-cyan-300">
    Admin Login
  </h2>

  <form id="loginForm" class="space-y-4">

    <input id="email" type="email"
      placeholder="Email"
      class="proInput" required>

    <input id="password" type="password"
      placeholder="Password"
      class="proInput" required>

    <button class="proBtn w-full">
      Login
    </button>

  </form>

  <p id="msg" class="mt-4 text-sm"></p>

</div>

<style>
.glassCard{
 backdrop-filter:blur(16px);
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.2);
 border-radius:20px;
}
.proInput{
 width:100%;
 padding:12px;
 border-radius:12px;
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.25);
}
.proBtn{
 padding:12px;
 border-radius:14px;
 background:linear-gradient(90deg,#22d3ee,#2563eb);
}
</style>

<script src="app.js"></script>

</body>
</html>
