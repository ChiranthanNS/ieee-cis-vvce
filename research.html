<!DOCTYPE html>
<html>
<head>
  <title>Research — IEEE CIS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <header class="p-6 border-b border-white/10">
  <div class="flex items-center justify-between">

    <!-- LEFT — Chapter Name -->
    <div>
      <h1 class="text-xl font-bold text-cyan-400">
        IEEE CIS VVCE Student Chapter
      </h1>
      <p class="text-xs text-slate-400">
        Vidya Vardhaka College of Engineering — Mysuru
      </p>
    </div>

    <!-- RIGHT — Logos -->
    <div class="flex items-center gap-3">

      <!-- IEEE CIS -->
      <img src="https://msyblaohdkpztytpbszp.supabase.co/storage/v1/object/public/gallery/IEEE%20CIS%20logo.jpg"
           class="h-20 object-contain bg-white rounded-md p-1">

      <!-- VVCE -->
      <img src="https://msyblaohdkpztytpbszp.supabase.co/storage/v1/object/public/gallery/vvce-logo.png"
           class="h-20 object-contain bg-white rounded-md p-1">

    </div>

  </div>
</header>
</head>

<body class="bg-slate-950 text-white">

<div id="pageRoot" class="opacity-0 transition-opacity duration-700">

<!-- gradient -->
<div class="fixed inset-0 -z-10">
  <div class="absolute w-[700px] h-[700px]
              bg-indigo-600/20 blur-[140px]"></div>
</div>

<!-- NAV — paste your pro navbar here -->

<section class="max-w-5xl mx-auto px-6 mt-20">

  <h2 class="text-4xl font-bold text-cyan-300"
      data-aos="fade-down">
    Research & Paper Summaries
  </h2>

  <p class="text-slate-400 mt-4">
    AI, ML and Computational Intelligence paper insights
    shared by IEEE CIS members
  </p>

  <div id="papersList"
       class="space-y-8 mt-12">
  </div>

</section>

</div>

<style>
.glassCard{
  backdrop-filter: blur(16px);
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  padding:28px;
  border-radius:20px;
}

.miniBtn{
 padding:8px 14px;
 border-radius:12px;
 background:linear-gradient(90deg,#22d3ee,#2563eb);
 box-shadow:0 0 18px rgba(56,189,248,.5);
 transition:.25s;
}
.miniBtn:hover{transform:scale(1.08);}
</style>

<script src="app.js" defer></script>

<script>
AOS.init({duration:900, once:true});
window.addEventListener("load",()=>pageRoot.classList.remove("opacity-0"));
</script>

</body>
</html>
