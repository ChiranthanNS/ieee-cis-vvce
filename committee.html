  <style>
  .navLink{position:relative;transition:.25s;}
  .navLink:hover{color:#67e8f9;}
  .navLink::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:#22d3ee;transition:.25s;}
  .navLink:hover::after{width:100%;}
  .socialBtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.25);font-weight:bold;transition:.25s;}
  .socialBtn:hover{transform:scale(1.15);box-shadow:0 0 20px rgba(56,189,248,.7);}
  .memberCard{backdrop-filter:blur(16px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);padding:20px;border-radius:20px;text-align:center;}
  .avatar{width:110px;height:110px;border-radius:999px;object-fit:cover;margin:auto;border:3px solid rgba(56,189,248,.6);}
  .glassCard{backdrop-filter:blur(16px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);padding:28px;border-radius:20px;box-shadow:0 0 40px rgba(0,0,0,0.4);}
  .miniBtn{padding:8px 14px;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#2563eb);box-shadow:0 0 18px rgba(56,189,248,.5);transition:.25s;display:inline-block;}
