<!DOCTYPE html>
<html>
<head>
  

  <title>Committee — IEEE CIS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <header class="p-6 border-b border-white/10">
  <div class="flex items-center justify-between">

    <!-- LEFT — Chapter Name -->
    <div>
      <h1 class="text-xl font-bold text-cyan-400">
        IEEE CIS VVCE Student Chapter
      </h1>
      <p class="text-xs text-slate-400">
        Vidya Vardhaka College of Engineering — Mysuru
      </p>
    </div>

    <!-- RIGHT — Logos -->
    <div class="flex items-center gap-3">

      <!-- IEEE CIS -->
      <img src="https://msyblaohdkpztytpbszp.supabase.co/storage/v1/object/public/gallery/IEEE%20CIS%20logo.jpg"
           class="h-20 object-contain bg-white rounded-md p-1">

      <!-- VVCE -->
      <img src="https://msyblaohdkpztytpbszp.supabase.co/storage/v1/object/public/gallery/vvce-logo.png"
           class="h-20 object-contain bg-white rounded-md p-1">

    </div>

  </div>
</header>
</head>

<body class="bg-slate-950 text-white">

<div id="pageRoot" class="opacity-0 transition-opacity duration-700">

<!-- gradient -->
<div class="fixed inset-0 -z-10">
  <div class="absolute w-[700px] h-[700px]
              bg-indigo-600/20 blur-[140px]"></div>
</div>

<!-- NAV — paste pro navbar -->

<section class="max-w-6xl mx-auto px-6 mt-20">

  <h2 class="text-4xl font-bold text-cyan-300"
      data-aos="fade-down">
    Chapter Committee
  </h2>

  <p class="text-slate-400 mt-4">
    Leadership team driving IEEE CIS VVCE initiatives
  </p>

  <div id="committeeGrid"
       class="grid md:grid-cols-2 lg:grid-cols-4 gap-8 mt-12">
  </div>

</section>

</div>

<style>
.memberCard{
  backdrop-filter: blur(16px);
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:999px;
  object-fit:cover;
  margin:auto;
  border:3px solid rgba(56,189,248,.6);
}
</style>

<script src="app.js" defer></script>

<script>
AOS.init({duration:900, once:true});
window.addEventListener("load",()=>pageRoot.classList.remove("opacity-0"));
</script>
<!-- COMMITTEE MODAL -->
<div id="memberModal"
     class="fixed inset-0 bg-black/70 backdrop-blur-sm
            hidden items-center justify-center z-50">

  <div class="glassCard max-w-2xl w-full relative">


    <!-- close -->
    <button id="modalClose"
      class="absolute top-3 right-4 text-xl text-slate-400 hover:text-white">
      ✕
    </button>

    <img id="modalImg"
     class="w-72 h-72 object-cover rounded-xl mx-auto">


    <h3 id="modalName"
        class="text-xl font-semibold text-cyan-300 mt-4 text-center"></h3>

    <p id="modalRole"
       class="text-center text-slate-400 mt-1"></p>

    <p id="modalBio"
       class="text-slate-300 mt-4 text-center"></p>

    <a id="modalLinkedin"
       target="_blank"
       class="miniBtn mt-5 inline-block text-center hidden">
       LinkedIn →
    </a>

  </div>
</div>

</body>
</html>
