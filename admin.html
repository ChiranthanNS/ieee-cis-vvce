<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CIS Admin Console</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
</head>

<body class="bg-slate-950 text-white">

<!-- gradient tech background -->
<div class="fixed inset-0 -z-10">
  <div class="absolute w-[700px] h-[700px]
              bg-cyan-600/20 blur-[140px] top-[-200px]"></div>
  <div class="absolute w-[700px] h-[700px]
              bg-indigo-600/20 blur-[140px] right-[-200px]"></div>
</div>

<!-- HEADER -->
<header class="p-6 border-b border-white/10">
  <h1 class="text-2xl font-bold">
    IEEE CIS Admin Console
  </h1>
  <p class="text-slate-400 text-sm">
    Event & Content Control Center
  </p>
</header>

<!-- MAIN GRID -->
<div class="max-w-7xl mx-auto p-6 grid lg:grid-cols-3 gap-8">

  <div class="glassCard" data-aos="fade-up">
    <h3 class="text-slate-400">Total Events</h3>
    <p id="statEvents" class="text-4xl font-bold mt-2 text-cyan-400">—</p>
  </div>

  <div class="glassCard" data-aos="fade-up">
    <h3 class="text-slate-400">Registrations</h3>
    <p id="statRegs" class="text-4xl font-bold mt-2 text-cyan-400">—</p>
  </div>

  <div class="glassCard" data-aos="fade-up">
    <h3 class="text-slate-400">Updates</h3>
    <p id="statUpdates" class="text-4xl font-bold mt-2 text-cyan-400">—</p>
  </div>

</div>

<div class="glassCard">
  <h3 class="text-slate-400">Projects</h3>
  <p id="statProjects"
     class="text-4xl font-bold mt-2 text-cyan-400">—</p>
</div>

<div class="glassCard">
  <h3 class="text-slate-400">Papers</h3>
  <p id="statPapers"
     class="text-4xl font-bold mt-2 text-cyan-400">—</p>
</div>

<!-- PANELS -->
<div class="max-w-7xl mx-auto p-6 grid lg:grid-cols-2 gap-10">

  <!-- ADD EVENT -->
  <div class="glassCard" data-aos="fade-right">

    <h2 class="text-xl font-bold mb-6 text-cyan-300">
      Create Event
    </h2>

    <form id="eventForm" class="space-y-4">

      <input id="etitle" placeholder="Title" class="adminInput" required>

      <textarea id="edesc" placeholder="Description"
        class="adminInput" required></textarea>

      <input id="edate" type="date" class="adminInput" required>

      <input id="evenue" placeholder="Venue" class="adminInput" required>

      <!-- GRID FIELDS -->
      <div class="grid md:grid-cols-2 gap-4">

        <div>
          <label class="text-sm text-slate-300">Upload Poster</label>
          <input type="file" id="posterFile" class="adminInput">
        </div>

        <div id="qrUploadBox">
          <label class="text-sm text-slate-300">Upload Payment QR</label>
          <input type="file" id="qrFile" class="adminInput">
        </div>

        <div>
          <label class="text-sm text-slate-300">Event Mode</label>
          <select id="eventMode" class="adminInput text-black">
            <option value="individual">Individual</option>
            <option value="team">Team</option>
          </select>
        </div>

        <div id="teamSizeBox">
          <label class="text-sm text-slate-300">Team Size</label>
          <input type="number" id="teamSize" min="1" class="adminInput">
        </div>

        <div>
          <label class="text-sm text-slate-300">Registration Fee (₹)</label>
          <input type="number" id="regFee" value="0" min="0" class="adminInput">
        </div>

      </div>

      <button class="adminBtn">
        Create Event
      </button>

    </form>

  </div>

  <!-- POST UPDATE -->
  <div class="glassCard" data-aos="fade-left">

    <h2 class="text-xl font-bold mb-6 text-cyan-300">
      Publish Update
    </h2>

    <form id="updateForm" class="space-y-3">
      <input id="utitle" placeholder="Title" class="adminInput" required>
      <textarea id="ucontent" placeholder="Content"
        class="adminInput" required></textarea>

      <button class="adminBtn">
        Publish Update
      </button>
    </form>

  </div>

</div>

<!-- STYLES -->
<style>
.glassCard{
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  padding:28px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.adminInput{
  width:100%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  padding:12px;
  border-radius:12px;
}

.adminBtn{
  width:100%;
  padding:14px;
  border-radius:14px;
  font-weight:600;
  background:linear-gradient(90deg,#22d3ee,#2563eb);
  box-shadow:0 0 30px rgba(56,189,248,.5);
  transition:.25s;
}
.adminBtn:hover{
  transform:scale(1.05);
}
</style>

<script src="app.js" defer></script>

<script>
AOS.init({duration:900, once:true});
</script>

<script>
supabase.auth.getSession().then(r=>{
 if(!r.data.session){
   window.location="admin-login.html";
 }
});
</script>

<!-- SOCIAL FLOAT -->
<div class="fixed bottom-6 left-6 flex flex-col gap-3 z-50">

  <a href="https://www.linkedin.com/in/ieee-cis-vvce-b103363b0"
     target="_blank"
     class="socialBtn">in</a>

  <a href="https://www.instagram.com/ieee.cis.vvce"
     target="_blank"
     class="socialBtn">ig</a>

</div>

<style>
.socialBtn{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.25);
  font-weight:bold;
  transition:.25s;
}
.socialBtn:hover{
  transform:scale(1.15);
  box-shadow:0 0 20px rgba(56,189,248,.7);
}
</style>


<!-- TEAM SIZE VISIBILITY -->
<script>
const modeSelect = document.getElementById("eventMode")
const teamSizeBox = document.getElementById("teamSizeBox")

if(modeSelect && teamSizeBox){
  function updateTeamVisibility() {
    teamSizeBox.style.display =
      modeSelect.value === "team" ? "block" : "none"
  }
  modeSelect.addEventListener("change", updateTeamVisibility)
  updateTeamVisibility()
}
</script>

<script>
const feeInput = document.getElementById("regFee")
const qrBox = document.getElementById("qrUploadBox")

if(feeInput && qrBox){
  function updateQRVisibility(){
    qrBox.style.display =
      Number(feeInput.value) > 0 ? "block" : "none"
  }

  feeInput.addEventListener("input", updateQRVisibility)
  updateQRVisibility()
}
</script>

</body>
</html>
