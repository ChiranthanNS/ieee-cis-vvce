<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — IEEE CIS</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">

<!-- gradient bg -->
<div class="fixed inset-0 -z-10">
  <div class="absolute w-[700px] h-[700px] bg-cyan-600/20 blur-[140px]"></div>
  <div class="absolute w-[700px] h-[700px] bg-indigo-600/20 blur-[140px] right-[-200px]"></div>
</div>

<!-- NAV -->
<nav class="sticky top-4 mx-6 backdrop-blur-xl
            bg-white/10 border border-white/20
            rounded-2xl shadow-xl z-50">

  <div class="px-6 py-3 flex justify-between items-center">
    <h1 class="font-bold">IEEE CIS VVCE</h1>

    <div class="hidden md:flex gap-6 text-sm">
      <a href="index.html" class="navLink">Home</a>
      <a href="events.html" class="navLink">Events</a>
      <a href="gallery.html" class="navLink text-cyan-300">Gallery</a>
      <a href="contact.html" class="navLink">Contact</a>
    </div>
  </div>
</nav>

<style>
.navLink{transition:.25s}
.navLink:hover{color:#67e8f9}
</style>

<!-- HEADER -->
<section class="max-w-6xl mx-auto px-6 mt-20 text-center">
  <h2 class="text-3xl font-bold text-cyan-300">
    Event Gallery
  </h2>
  <p class="text-slate-400 mt-3">
    Moments from IEEE CIS events, workshops and activities
  </p>
</section>

<!-- GRID -->
<section class="max-w-6xl mx-auto px-6 mt-12">

  <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">

    <!-- SAMPLE CARDS — replace later -->
    <img src="https://picsum.photos/600/400?1"
         class="galImg">

    <img src="https://picsum.photos/600/400?2"
         class="galImg">

    <img src="https://picsum.photos/600/400?3"
         class="galImg">

    <img src="https://picsum.photos/600/400?4"
         class="galImg">

    <img src="https://picsum.photos/600/400?5"
         class="galImg">

    <img src="https://picsum.photos/600/400?6"
         class="galImg">

  </div>

</section>

<style>
.galImg{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:18px;
  cursor:pointer;
  transition:.3s;
  border:1px solid rgba(255,255,255,.2);
}
.galImg:hover{
  transform:scale(1.04);
  box-shadow:0 0 30px rgba(56,189,248,.4);
}
</style>

<!-- IMAGE MODAL -->
<div id="imgModal"
     class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
  <img id="imgModalSrc"
       class="max-w-[90%] max-h-[90%] rounded-2xl">
</div>

<script>
function openImgModal(src){
  imgModalSrc.src = src
  imgModal.classList.remove("hidden")
  imgModal.classList.add("flex")
}

document.querySelectorAll(".galImg")
.forEach(img=>{
  img.onclick = ()=> openImgModal(img.src)
})

imgModal.onclick = ()=>{
  imgModal.classList.add("hidden")
  imgModal.classList.remove("flex")
}
</script>

</body>
</html>
