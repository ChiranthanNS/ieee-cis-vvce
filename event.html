<script>
AOS.init({duration:900, once:true});
window.addEventListener("load",()=>pageRoot.classList.remove("opacity-0"));

<div class="fixed bottom-6 left-6 flex flex-col gap-3 z-50">

</div>

<style>
.socialBtn{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.25);
  font-weight:bold;
  transition:.25s;
}
.socialBtn:hover{
  transform:scale(1.15);
  box-shadow:0 0 20px rgba(56,189,248,.7);
}
</style>

<!-- IMAGE ZOOM MODAL -->
<div id="imgModal"
     class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">

  <img id="imgModalSrc"
       class="max-w-[90%] max-h-[90%] rounded-2xl shadow-2xl">

</div>

<script>
function openImgModal(src){
  const m = document.getElementById("imgModal")
  const i = document.getElementById("imgModalSrc")
  i.src = src
  m.classList.remove("hidden")
  m.classList.add("flex")
}

document.getElementById("imgModal")
?.addEventListener("click", ()=>{
  imgModal.classList.add("hidden")
  imgModal.classList.remove("flex")
})
</script>
