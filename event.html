<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details — IEEE CIS VVCE</title>
  <meta name="description" content="Event details and registration for IEEE CIS VVCE Student Chapter events.">

  <style>
  .navLink{position:relative;transition:.25s;}
  .navLink:hover{color:#67e8f9;}
  .navLink::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:#22d3ee;transition:.25s;}
  .navLink:hover::after{width:100%;}
  .socialBtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.25);font-weight:bold;transition:.25s;}
  .socialBtn:hover{transform:scale(1.15);box-shadow:0 0 20px rgba(56,189,248,.7);}
  .proBtn{padding:14px 28px;border-radius:16px;font-weight:600;background:linear-gradient(90deg,#22d3ee,#2563eb);box-shadow:0 0 30px rgba(56,189,248,.5);transition:.25s;display:inline-block;}
  .proBtn:hover{transform:scale(1.05);}
  .glassCard{backdrop-filter:blur(16px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);padding:24px;border-radius:20px;}
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
</head>

<body class="bg-slate-950 text-white">

<!-- CHAPTER HEADER -->
<header class="p-6 border-b border-white/10">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-cyan-400">IEEE CIS VVCE Student Chapter</h1>
      <p class="text-xs text-slate-400">Vidya Vardhaka College of Engineering — Mysuru</p>
    </div>
    <div class="flex items-center gap-3">
      <img src="https://msyblaohdkpztytpbszp.supabase.co/storage/v1/object/public/gallery/IEEE%20CIS%20logo.jpg"
           class="h-8 sm:h-10 md:h-12 w-auto object-contain" alt="IEEE CIS Logo">
      <img src="https://msyblaohdkpztytpbszp.supabase.co/storage/v1/object/public/gallery/vvce-logo.png"
           class="h-8 sm:h-10 md:h-12 w-auto object-contain" alt="VVCE Logo">
    </div>
  </div>
</header>

<div id="pageRoot" class="opacity-0 transition-opacity duration-700">

<!-- gradient bg -->
<div class="fixed inset-0 -z-10">
  <div class="absolute w-[700px] h-[700px] bg-cyan-600/20 blur-[140px]"></div>
  <div class="absolute w-[700px] h-[700px] bg-indigo-600/20 blur-[140px] right-[-200px]"></div>
</div>

<!-- NAV -->
<nav class="sticky top-4 mx-6 backdrop-blur-xl bg-white/10 border border-white/20 rounded-2xl shadow-xl z-50">
  <div class="px-6 py-3 flex justify-between items-center">
    <span class="font-bold tracking-wide">IEEE CIS VVCE</span>
    <div class="hidden md:flex gap-6 text-sm">
      <a href="index.html" class="navLink">Home</a>
      <a href="events.html" class="navLink">Events</a>
      <a href="projects.html" class="navLink">Projects</a>
      <a href="research.html" class="navLink">Research</a>
      <a href="resources.html" class="navLink">Resources</a>
      <a href="gallery.html" class="navLink">Gallery</a>
      <a href="committee.html" class="navLink">Committee</a>
      <a href="contact.html" class="navLink">Contact</a>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<section class="max-w-4xl mx-auto px-6 mt-20">
  <div id="eventBox"
       class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-2xl p-10 shadow-xl"
       data-aos="fade-up">
  </div>
</section>

</div><!-- /pageRoot -->

<script src="app.js" defer></script>
<script>
AOS.init({duration:900, once:true});
window.addEventListener("load",()=>document.getElementById("pageRoot").classList.remove("opacity-0"));
</script>

<!-- SOCIAL FLOAT -->
<div class="fixed bottom-6 left-6 flex flex-col gap-3 z-50">
  <a href="https://www.linkedin.com/in/ieee-cis-vvce-b103363b0" target="_blank" class="socialBtn">in</a>
  <a href="https://www.instagram.com/ieee.cis.vvce" target="_blank" class="socialBtn">ig</a>
</div>

<!-- IMAGE ZOOM MODAL -->
<div id="imgModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
  <img id="imgModalSrc" class="max-w-[90%] max-h-[90%] rounded-2xl shadow-2xl">
</div>

<script>
function openImgModal(src){
  const m = document.getElementById("imgModal");
  const i = document.getElementById("imgModalSrc");
  i.src = src;
  m.classList.remove("hidden");
  m.classList.add("flex");
}
document.getElementById("imgModal")?.addEventListener("click", ()=>{
  const m = document.getElementById("imgModal");
  m.classList.add("hidden");
  m.classList.remove("flex");
});
</script>

</body>
</html>
